<form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
  <div class="space-y-2">
    <label class="text-sm font-semibold text-zinc-700">
      Correo electrónico
    </label>

    <input
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="admin@ejemplo.com"
      class="w-full rounded-2xl border border-zinc-200 bg-white px-4 py-3 text-sm text-zinc-800 outline-none transition focus:border-[#8f50c4] focus:ring-4 focus:ring-purple-100"
    />

    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="text-xs font-medium text-red-500">
        Introduce un correo válido.
      </p>
    }
  </div>

  <div class="space-y-2">
    <label class="text-sm font-semibold text-zinc-700"> Contraseña </label>

    <div class="relative">
      <input
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        placeholder="Introduce tu contraseña"
        class="w-full rounded-2xl border border-zinc-200 bg-white px-4 py-3 pr-12 text-sm text-zinc-800 outline-none transition focus:border-[#8f50c4] focus:ring-4 focus:ring-purple-100"
      />

      <button
        type="button"
        (click)="togglePassword()"
        class="absolute right-3 top-1/2 -translate-y-1/2 rounded-full px-2 py-1 text-xs font-semibold text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-800"
      >
        {{ showPassword() ? "Ocultar" : "Ver" }}
      </button>
    </div>

    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="text-xs font-medium text-red-500">Introduce la contraseña.</p>
    }
  </div>

  <button
    type="submit"
    class="w-full rounded-2xl bg-[#8f50c4] px-5 py-3 text-sm font-bold text-white shadow-lg shadow-purple-200 transition hover:-translate-y-0.5 hover:bg-[#7c3db5] active:translate-y-0"
  >
    Entrar
  </button>
</form>
