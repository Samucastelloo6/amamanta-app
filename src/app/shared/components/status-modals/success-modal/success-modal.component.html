<div
  class="fixed inset-0 z-[9999] overflow-y-auto bg-black/45 px-4 py-6 backdrop-blur-sm"
>
  <div class="flex min-h-full items-center justify-center">
    <div
      class="w-full max-w-[460px] animate-[popup_0.28s_cubic-bezier(0.18,0.89,0.32,1.28)] rounded-[32px] border border-[#eadff5] bg-white p-6 text-center shadow-[0_30px_80px_rgba(143,80,196,0.22)] sm:p-8"
    >
      <div
        class="mx-auto flex h-24 w-24 animate-[logo-pop_0.45s_ease-out_0.08s_both] items-center justify-center rounded-[28px] bg-[#faf5ff] ring-1 ring-[#eadff5] sm:h-28 sm:w-28 sm:rounded-[32px]"
      >
        <img
          src="/logo-amamanta.png"
          alt="Amamanta"
          class="h-20 w-20 object-contain sm:h-24 sm:w-24"
        />
      </div>

      <h2
        class="mt-6 animate-[fade-up_0.35s_ease-out_0.12s_both] text-2xl font-extrabold leading-tight text-[#8f50c4] sm:text-[30px]"
      >
        {{ title }}
      </h2>

      <p
        class="mt-4 animate-[fade-up_0.35s_ease-out_0.18s_both] text-sm leading-7 text-zinc-600 sm:text-[15px]"
      >
        {{ message }}
      </p>

      <button
        type="button"
        (click)="closeModal()"
        class="mt-8 w-full animate-[fade-up_0.35s_ease-out_0.24s_both] rounded-full bg-gradient-to-r from-[#8f50c4] to-[#7b3fb1] px-6 py-3 text-sm font-extrabold text-white shadow-lg shadow-purple-200 transition duration-200 hover:-translate-y-0.5 hover:scale-[1.02]"
      >
        {{ buttonText }}
      </button>
    </div>
  </div>
</div>
