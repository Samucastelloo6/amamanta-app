<section
  class="min-h-screen w-full overflow-x-hidden bg-gradient-to-b from-[#fbf7fd] via-white to-[#f6fbf3] px-3 py-4 sm:px-5 lg:px-6"
>
  <div class="mx-auto w-full max-w-6xl overflow-hidden">
    <header class="mb-5 text-center">
      <p
        class="text-xs font-extrabold uppercase tracking-[0.22em] text-[#8f50c4]"
      >
        Amamanta
      </p>

      <h1
        class="mt-1 text-2xl font-extrabold leading-tight text-zinc-800 sm:text-3xl lg:text-4xl"
      >
        Espacios Amigos de la Lactancia Materna
      </h1>

      <p class="mx-auto mt-1 max-w-2xl text-sm font-medium text-zinc-500">
        Localiza comercios que protegen la lactancia ofreciendo un espacio para
        amamantar sin necesidad de comprar o consumir.
      </p>
    </header>

    <app-friendly-space-filters-list
      [spaces]="spaces"
      [categories]="categories"
      [userPosition]="userPosition"
      [selectedSpaceId]="selectedResource?.id ?? null"
      (spaceSelected)="viewSpaceOnMap($event)"
      (filteredSpacesChanged)="onFilteredSpacesChanged($event)"
    />

    <section class="grid gap-4 lg:grid-cols-[1fr_320px]">
      <div
        class="relative overflow-hidden rounded-[22px] border border-[#eadff5] bg-white shadow-lg shadow-purple-100/60"
      >
        <app-resource-map
          class="block w-full"
          [resources]="displayedSpaces"
          [selectedResource]="selectedResource"
          markerImage="/espacio-amigo.png"
          mapId="DEMO_MAP_ID"
          mapHeight="560px"
          [initialCenter]="initialMapCenter"
          [initialZoom]="14"
          [selectedZoom]="17"
          [boundsPadding]="80"
          [minimumFitZoom]="13"
          [locateUserOnInit]="true"
          [fitMarkersOnInit]="true"
          [highlightSelectedMarker]="true"
          (resourceSelected)="selectResource($event)"
          (userPositionChanged)="updateUserPosition($event)"
        />

        @if (selectedResource; as space) {
          <app-friendly-space-detail-card
            [space]="space"
            [categories]="categories"
            [routeActive]="routeActive"
            variant="mobile"
            (close)="closeCard()"
            (navigate)="navigateToResource()"
          />
        }
      </div>

      @if (selectedResource; as space) {
        <app-friendly-space-detail-card
          [space]="space"
          [categories]="categories"
          [routeActive]="routeActive"
          variant="desktop"
          (close)="closeCard()"
          (navigate)="navigateToResource()"
        />
      }
    </section>
  </div>
</section>
