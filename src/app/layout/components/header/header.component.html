<header
  class="sticky top-0 z-50 border-b border-[#eadff5]/80 bg-white/95 shadow-[0_8px_26px_rgba(143,80,196,0.07)] backdrop-blur-2xl"
>
  <div
    class="mx-auto flex w-full max-w-[1750px] items-center gap-4 px-4 py-2 sm:px-6 xl:px-8 2xl:px-10"
  >
    <div
      routerLink="/"
      class="group flex min-w-0 shrink-0 cursor-pointer items-center gap-3"
    >
      <div
        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-[18px] bg-white shadow-sm ring-1 ring-[#eadff5] transition-all duration-200 group-hover:scale-[1.03] sm:h-[52px] sm:w-[52px]"
      >
        <img
          src="/logo-amamanta.png"
          alt="Amamanta"
          class="h-9 w-9 object-contain sm:h-10 sm:w-10"
        />
      </div>

      <div class="min-w-0">
        <p
          class="m-0 truncate text-xl font-extrabold leading-none text-[#8f50c4] sm:text-2xl"
        >
          Amamanta
        </p>

        <p
          class="m-0 mt-0.5 hidden whitespace-nowrap text-xs font-semibold text-zinc-500 sm:block"
        >
          Apoyo a la lactancia materna
        </p>
      </div>
    </div>

    <nav
      class="mx-auto hidden min-w-0 items-center rounded-full border border-[#eadff5] bg-white px-1.5 py-1 shadow-sm xl:flex"
    >
      <a
        routerLink="/talleres"
        routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
        class="whitespace-nowrap rounded-full px-3 py-1.5 text-[13px] font-extrabold text-zinc-600 transition-all duration-200 hover:bg-[#faf5ff] hover:text-[#8f50c4] 2xl:px-3.5 2xl:text-sm"
      >
        Talleres de lactancia
      </a>

      <a
        routerLink="/hospitales"
        routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
        class="whitespace-nowrap rounded-full px-3 py-1.5 text-[13px] font-extrabold text-zinc-600 transition-all duration-200 hover:bg-[#faf5ff] hover:text-[#8f50c4] 2xl:px-3.5 2xl:text-sm"
      >
        Hospitales
      </a>

      <a
        routerLink="/eventos"
        routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
        class="whitespace-nowrap rounded-full px-3 py-1.5 text-[13px] font-extrabold text-zinc-600 transition-all duration-200 hover:bg-[#faf5ff] hover:text-[#8f50c4] 2xl:px-3.5 2xl:text-sm"
      >
        Actividades
      </a>

      <a
        routerLink="/salas-universitarias"
        routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
        class="whitespace-nowrap rounded-full px-3 py-1.5 text-[13px] font-extrabold text-zinc-600 transition-all duration-200 hover:bg-[#faf5ff] hover:text-[#8f50c4] 2xl:px-3.5 2xl:text-sm"
      >
        Salas lactancia UV
      </a>

      <a
        routerLink="/espacios-amigos"
        routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
        class="whitespace-nowrap rounded-full px-3 py-1.5 text-[13px] font-extrabold text-zinc-600 transition-all duration-200 hover:bg-[#faf5ff] hover:text-[#8f50c4] 2xl:px-3.5 2xl:text-sm"
      >
        Espacios amigos LM
      </a>

      <a
        routerLink="/contacto"
        routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
        class="whitespace-nowrap rounded-full px-3 py-1.5 text-[13px] font-extrabold text-zinc-600 transition-all duration-200 hover:bg-[#faf5ff] hover:text-[#8f50c4] 2xl:px-3.5 2xl:text-sm"
      >
        Contacto
      </a>

      <a
        routerLink="/valora"
        routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
        class="whitespace-nowrap rounded-full px-3 py-1.5 text-[13px] font-extrabold text-zinc-600 transition-all duration-200 hover:bg-[#faf5ff] hover:text-[#8f50c4] 2xl:px-3.5 2xl:text-sm"
      >
        Valora
      </a>

      <a
        routerLink="/colabora"
        routerLinkActive="!from-[#7b3fb1] !to-[#8f50c4]"
        class="ml-1 whitespace-nowrap rounded-full bg-gradient-to-r from-[#8f50c4] to-[#7b3fb1] px-4 py-1.5 text-[13px] font-extrabold text-white shadow-md shadow-purple-200 transition-all duration-200 hover:scale-[1.02] 2xl:px-5 2xl:text-sm"
      >
        Colabora
      </a>
    </nav>

    <div class="hidden shrink-0 items-center gap-2 xl:flex">
      <a
        href="https://amamanta.es"
        target="_blank"
        rel="noopener"
        class="whitespace-nowrap rounded-full border border-[#eadff5] bg-white px-3.5 py-1.5 text-[13px] font-extrabold text-[#8f50c4] shadow-sm transition-all duration-200 hover:scale-[1.02] hover:bg-[#faf5ff] 2xl:px-4 2xl:text-sm"
      >
        Web oficial
      </a>

      <a
        [routerLink]="adminRoute()"
        (click)="menuOpen = false"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl border border-[#eadff5] bg-white text-[#8f50c4] shadow-sm transition-all duration-200 hover:scale-[1.03] hover:bg-[#faf5ff]"
        [attr.aria-label]="
          isAuthenticated()
            ? 'Panel de administración'
            : 'Acceso administradora'
        "
        [title]="
          isAuthenticated()
            ? 'Panel de administración'
            : 'Acceso administradora'
        "
      >
        <iconify-icon
          [icon]="
            isAuthenticated()
              ? 'solar:shield-user-bold'
              : 'solar:lock-keyhole-bold'
          "
          class="text-lg"
        ></iconify-icon>
      </a>
    </div>

    <div class="ml-auto flex shrink-0 items-center gap-2 xl:hidden">
      <a
        [routerLink]="adminRoute()"
        class="flex h-10 w-10 items-center justify-center rounded-2xl border border-[#eadff5] bg-white text-[#8f50c4] shadow-sm"
        [attr.aria-label]="
          isAuthenticated()
            ? 'Panel de administración'
            : 'Acceso administradora'
        "
        [title]="
          isAuthenticated()
            ? 'Panel de administración'
            : 'Acceso administradora'
        "
      >
        <iconify-icon
          [icon]="
            isAuthenticated()
              ? 'solar:widget-5-bold'
              : 'solar:lock-keyhole-bold'
          "
          class="text-lg"
        ></iconify-icon>
      </a>

      <button
        type="button"
        (click)="menuOpen = !menuOpen"
        class="flex h-10 w-10 items-center justify-center rounded-2xl border border-[#eadff5] bg-white text-[#8f50c4] shadow-sm"
        [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
      >
        <iconify-icon
          [icon]="
            menuOpen ? 'solar:close-circle-bold' : 'solar:hamburger-menu-bold'
          "
          class="text-2xl"
        ></iconify-icon>
      </button>
    </div>
  </div>

  @if (menuOpen) {
    <div
      class="mx-3 mb-3 rounded-[24px] border border-[#eadff5] bg-white/95 p-2 shadow-xl shadow-purple-100 backdrop-blur-xl xl:hidden"
    >
      <nav class="grid gap-1">
        <a
          routerLink="/eventos"
          routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
          (click)="menuOpen = false"
          class="rounded-2xl px-4 py-2.5 text-sm font-extrabold text-zinc-700"
        >
          Actividades
        </a>

        <a
          routerLink="/talleres"
          routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
          (click)="menuOpen = false"
          class="rounded-2xl px-4 py-2.5 text-sm font-extrabold text-zinc-700"
        >
          Talleres de lactancia
        </a>

        <a
          routerLink="/hospitales"
          routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
          (click)="menuOpen = false"
          class="rounded-2xl px-4 py-2.5 text-sm font-extrabold text-zinc-700"
        >
          Hospitales
        </a>

        <a
          routerLink="/salas-universitarias"
          routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
          (click)="menuOpen = false"
          class="rounded-2xl px-4 py-2.5 text-sm font-extrabold text-zinc-700"
        >
          Salas lactancia UV
        </a>

        <a
          routerLink="/espacios-amigos"
          routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
          (click)="menuOpen = false"
          class="rounded-2xl px-4 py-2.5 text-sm font-extrabold text-zinc-700"
        >
          Espacios amigos LM
        </a>

        <a
          routerLink="/contacto"
          routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
          (click)="menuOpen = false"
          class="rounded-2xl px-4 py-2.5 text-sm font-extrabold text-zinc-700"
        >
          Contacto
        </a>

        <a
          routerLink="/valora"
          routerLinkActive="bg-[#f4eafa] text-[#8f50c4]"
          (click)="menuOpen = false"
          class="rounded-2xl px-4 py-2.5 text-sm font-extrabold text-zinc-700"
        >
          Valora
        </a>

        <div class="my-1 h-px bg-[#eadff5]"></div>

        <a
          routerLink="/colabora"
          (click)="menuOpen = false"
          class="rounded-2xl bg-gradient-to-r from-[#8f50c4] to-[#7b3fb1] px-4 py-3 text-center text-sm font-extrabold text-white shadow-md shadow-purple-200"
        >
          Colabora
        </a>

        <a
          href="https://amamanta.es"
          target="_blank"
          rel="noopener"
          (click)="menuOpen = false"
          class="rounded-2xl px-4 py-2.5 text-sm font-extrabold text-[#8f50c4]"
        >
          Web oficial
        </a>
      </nav>
    </div>
  }
</header>
