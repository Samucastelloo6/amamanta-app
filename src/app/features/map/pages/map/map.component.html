<section class="map-page">

  <h1>Mapa Amamanta</h1>

  <div class="map-wrapper">

    <google-map
      height="600px"
      width="100%"
      [center]="center"
      [zoom]="zoom"
      [options]="mapOptions"
      mapId="DEMO_MAP_ID">

      @for (marker of markers; track marker.title) {
        <map-advanced-marker
          [position]="marker.position"
          [title]="marker.title"
          [content]="marker.content"
          (mapClick)="selectResource(marker.resource)">
        </map-advanced-marker>
      }

    </google-map>

    @if (selectedResource) {
      <article class="resource-card">
        <button class="close-button" (click)="closeCard()">✕</button>

        <h2>{{ selectedResource.name }}</h2>

        <p class="address">
          {{ selectedResource.address }}
        </p>

        <p class="description">
          {{ selectedResource.description }}
        </p>

        <div class="card-actions">
          <button class="primary-button">
            Cómo llegar
          </button>

          <button class="secondary-button">
            Ver detalles
          </button>
        </div>
      </article>
    }

  </div>

</section>
