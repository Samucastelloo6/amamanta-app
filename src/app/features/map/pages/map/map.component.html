<div class="map-page">
  <h1>Mapa de recursos Amamanta</h1>

  <div class="map-filters">
    <label>
      <input
        type="checkbox"
        [(ngModel)]="showLactationRooms"
        (change)="refreshMarkers()"
      />
      Salas universitarias
    </label>

    <label>
      <input
        type="checkbox"
        [(ngModel)]="showFriendlySpaces"
        (change)="refreshMarkers()"
      />
      Espacios amigos
    </label>

    <select [(ngModel)]="selectedSector" (change)="refreshMarkers()">
      <option value="all">Todos los sectores</option>
      <option value="food">Alimentación</option>
      <option value="fashion">Moda</option>
      <option value="beauty">Belleza</option>
      <option value="health">Salud</option>
      <option value="services">Servicios</option>
    </select>
  </div>

  <div id="map"></div>
</div>
