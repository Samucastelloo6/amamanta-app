<form class="space-y-4" (ngSubmit)="save()">
  <div>
    <label class="block text-sm font-extrabold text-zinc-600">
      Nombre de la categoría <span class="text-red-500">*</span>
    </label>

    <input
      type="text"
      name="name"
      [(ngModel)]="form.name"
      (input)="clearFieldError('name')"
      [ngClass]="
        fieldErrors.name
          ? 'border-red-300 bg-red-50 focus:border-red-500'
          : 'border-[#eadff5] bg-[#fcfaff] focus:border-[#8f50c4] focus:bg-white'
      "
      class="mt-2 w-full rounded-2xl border px-4 py-3 text-sm font-semibold text-zinc-700 outline-none transition placeholder:text-zinc-400"
      placeholder="Ej. Alimentación ecológica"
      autocomplete="off"
    />

    @if (fieldErrors.name) {
      <p class="mt-1 text-xs font-bold text-red-600">
        {{ fieldErrors.name }}
      </p>
    }
  </div>

  <label
    class="flex cursor-pointer items-center justify-between gap-4 rounded-2xl border border-[#eadff5] bg-[#fcfaff] px-4 py-3 transition hover:bg-[#faf5ff]"
  >
    <span>
      <span class="block text-sm font-extrabold text-zinc-700">
        Visible en los filtros
      </span>

      <span class="block text-xs font-semibold text-zinc-500">
        Si está desactivada, la categoría no aparecerá en la parte pública.
      </span>
    </span>

    <input
      type="checkbox"
      name="isActive"
      [(ngModel)]="form.isActive"
      class="size-5 accent-[#8f50c4]"
    />
  </label>

  <p
    class="rounded-2xl bg-[#faf5ff] px-4 py-3 text-xs font-semibold leading-5 text-zinc-500"
  >
    La administradora solo introduce el nombre. El identificador interno se
    genera automáticamente.
  </p>

  <div class="grid gap-3 pt-2 sm:grid-cols-2">
    <button
      type="button"
      (click)="cancel()"
      class="rounded-full border border-[#eadff5] bg-white px-6 py-3 text-sm font-extrabold text-zinc-600 transition hover:bg-[#faf5ff] hover:text-[#8f50c4]"
    >
      Cancelar
    </button>

    <button
      type="submit"
      class="rounded-full bg-gradient-to-r from-[#8f50c4] to-[#7b3fb1] px-6 py-3 text-sm font-extrabold text-white shadow-lg shadow-purple-200 transition hover:-translate-y-0.5 hover:scale-[1.02]"
    >
      {{ category ? "Guardar cambios" : "Guardar categoría" }}
    </button>
  </div>
</form>

@if (showWarningModal) {
  <app-warning-modal
    title="Revisa el formulario"
    [message]="warningMessage"
    buttonText="Revisar formulario"
    (close)="closeWarningModal()"
  />
}
