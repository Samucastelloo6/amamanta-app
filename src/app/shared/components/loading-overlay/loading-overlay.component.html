@if (loadingService.isLoading()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-white/75 backdrop-blur-sm"
    role="status"
    aria-live="polite"
    aria-label="Cargando"
  >
    <div
      class="flex flex-col items-center gap-4 rounded-[28px] border border-[#eadff5] bg-white px-8 py-6 shadow-2xl shadow-purple-200/70"
    >
      <div class="relative flex h-20 w-20 items-center justify-center">
        <div
          class="absolute inset-0 animate-spin rounded-full border-4 border-[#eadff5] border-t-[#8f50c4]"
        ></div>

        <div
          class="flex h-14 w-14 items-center justify-center rounded-full bg-white shadow-sm"
        >
          <img
            src="/logo-amamanta.png"
            alt=""
            class="h-11 w-11 object-contain"
          />
        </div>
      </div>

      <div class="text-center">
        <p class="text-sm font-extrabold text-[#8f50c4]">Cargando</p>

        <p class="mt-1 text-xs font-semibold text-zinc-500">
          Un momento, por favor...
        </p>
      </div>
    </div>
  </div>
}
