<div
  class="fixed inset-0 z-[9999] overflow-y-auto bg-black/45 px-4 py-6 backdrop-blur-sm"
>
  <div class="flex min-h-full items-center justify-center">
    <div
      class="w-full max-w-[460px] rounded-[32px] border border-[#eadff5] bg-white p-6 text-center shadow-[0_30px_80px_rgba(143,80,196,0.18)] sm:p-8"
    >
      <div
        class="mx-auto flex h-20 w-20 items-center justify-center rounded-[24px] bg-[#fff8e6] ring-1 ring-[#f5d27a] sm:h-24 sm:w-24 sm:rounded-[28px]"
      >
        <iconify-icon
          icon="solar:shield-warning-bold"
          class="text-5xl text-[#d97706]"
        ></iconify-icon>
      </div>

      <h2
        class="mt-6 text-2xl font-extrabold leading-tight text-[#b45309] sm:text-[30px]"
      >
        {{ title }}
      </h2>

      <div
        class="mt-5 rounded-[22px] border border-amber-200 bg-amber-50 px-4 py-4"
      >
        <p class="text-sm leading-7 font-medium text-amber-900">
          {{ message }}
        </p>
      </div>

      <button
        type="button"
        (click)="closeModal()"
        class="mt-8 w-full rounded-full bg-gradient-to-r from-amber-500 to-amber-600 px-6 py-3 text-sm font-extrabold text-white shadow-lg shadow-amber-200 transition duration-200 hover:-translate-y-0.5 hover:scale-[1.02] hover:from-amber-600 hover:to-amber-700"
      >
        {{ buttonText }}
      </button>
    </div>
  </div>
</div>
