<div
  class="fixed inset-0 z-[9999] overflow-y-auto bg-black/45 px-4 py-6 backdrop-blur-sm"
  (click)="cancelAction()"
>
  <div class="flex min-h-full items-center justify-center">
    <div
      (click)="$event.stopPropagation()"
      class="w-full max-w-[460px] rounded-[32px] border border-[#eadff5] bg-white p-6 text-center shadow-[0_30px_80px_rgba(220,38,38,0.16)] sm:p-8"
    >
      <div
        class="mx-auto flex h-20 w-20 items-center justify-center rounded-[24px] bg-red-50 ring-1 ring-red-200 sm:h-24 sm:w-24 sm:rounded-[28px]"
      >
        <iconify-icon
          icon="solar:trash-bin-trash-bold"
          class="text-5xl text-red-600"
        ></iconify-icon>
      </div>

      <h2
        class="mt-6 text-2xl font-extrabold leading-tight text-red-700 sm:text-[30px]"
      >
        {{ title }}
      </h2>

      <div
        class="mt-5 rounded-[22px] border border-red-200 bg-red-50 px-4 py-4"
      >
        <p class="text-sm font-medium leading-7 text-red-900">
          {{ message }}
        </p>
      </div>

      <div class="mt-8 grid grid-cols-1 gap-3 sm:grid-cols-2">
        <button
          type="button"
          (click)="cancelAction()"
          class="rounded-full border border-[#eadff5] bg-white px-6 py-3 text-sm font-extrabold text-zinc-600 transition hover:bg-[#faf5ff] hover:text-[#8f50c4]"
        >
          {{ cancelText }}
        </button>

        <button
          type="button"
          (click)="confirmAction()"
          class="rounded-full bg-gradient-to-r from-red-500 to-red-600 px-6 py-3 text-sm font-extrabold text-white shadow-lg shadow-red-200 transition duration-200 hover:-translate-y-0.5 hover:scale-[1.02] hover:from-red-600 hover:to-red-700"
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
</div>
