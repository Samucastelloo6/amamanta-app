<article
  class="rounded-[22px] border border-[#eadff5] bg-white p-4 shadow-lg shadow-purple-100/60 sm:p-5"
>
  <div class="flex items-start gap-3">
    <div
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-[#f4eafa]"
    >
      <iconify-icon
        icon="mdi:video-outline"
        class="text-xl text-[#8f50c4]"
      ></iconify-icon>
    </div>

    <div class="min-w-0">
      <span
        class="inline-flex rounded-full bg-[#f4eafa] px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-[0.14em] text-[#8f50c4]"
      >
        Taller online
      </span>

      <h2
        class="mt-2 text-xl font-extrabold leading-tight text-zinc-800 sm:text-2xl"
      >
        {{ workshop.name }}
      </h2>

      <p class="mt-1 text-sm font-extrabold capitalize text-[#8f50c4]">
        {{ workshop.day }} · {{ workshop.schedule }}
      </p>
    </div>
  </div>

  @if (workshop.notes) {
    <p
      class="mt-4 rounded-2xl bg-[#f6fbf3] px-4 py-3 text-sm font-semibold leading-6 text-zinc-600"
    >
      {{ workshop.notes }}
    </p>
  }

  <a
    [href]="'mailto:' + registrationEmail"
    class="mt-4 flex items-center justify-between gap-3 rounded-2xl bg-[#f4eafa] px-4 py-3 transition hover:bg-[#eedcf9]"
  >
    <div class="min-w-0">
      <p
        class="text-[10px] font-black uppercase tracking-[0.14em] text-zinc-500"
      >
        Inscripciones
      </p>

      <p class="mt-1 break-all text-sm font-extrabold text-[#8f50c4]">
        {{ registrationEmail }}
      </p>
    </div>

    <span
      class="shrink-0 rounded-full bg-[#8f50c4] px-3 py-1.5 text-xs font-extrabold text-white"
    >
      Escribir
    </span>
  </a>

  <a
    routerLink="/experiencias/workshops"
    class="mt-3 flex w-full items-center justify-center rounded-full border border-[#8f50c4] px-4 py-2.5 text-sm font-extrabold text-[#8f50c4] transition hover:bg-[#faf5ff]"
  >
    Experiencias
  </a>
</article>
